<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trim podcast and interview recordings into short clips, right in the browser. Files are never uploaded." />
    <meta name="theme-color" content="#f4f5f7" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6cff'/%3E%3Cpath d='M11 8H8v16h3M21 8h3v16h-3' fill='none' stroke='%23ffffff' stroke-width='2.5'/%3E%3Crect x='14.75' y='7' width='2.5' height='18' rx='1' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <title>Clip Editor</title>
    <script>
      // Light by default; apply a saved choice of dark before first paint to avoid a flash.
      let theme = 'light';
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch {}
      document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please don't attach your recording: describe the file instead (type, length, size). Files never leave your computer when you use Clip Editor, and they shouldn't need to here either.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a 2-hour MP4
        2. Set the clip to 1:00:00–1:01:00
        3. Export as 9:16 video
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File type, length and size
      placeholder: MP4 (H.264 + AAC), 1 h 45 min, 2.3 GB
  - type: textarea
    id: environment
    attributes:
      label: Browser and app version
      description: Filled in for you when you use "Report a problem" in the app.
      placeholder: Chrome 131 on Windows 11 · Clip Editor 0.1.0 (abc1234)
    validations:
      required: true
